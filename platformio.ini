[env:esp32-4848s040]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1-n16r8v
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ESP32-S3 with 480x480 RGB display (ESP32-4848S040)
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
; The custom board JSON declares upload.flash_size = 8MB, which wins over
; board_build.flash_size and writes an 8MB image header.  With the 16MB
; partition table the (silent) bootloader then refuses to boot the app.
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB.csv

; PSRAM enabled for framebuffer
board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = partitions_16MB.csv

build_flags = 
    ; 4848S040 USB-C is connected through a USB-UART bridge (UART0/CH340).
    ; Keep native USB CDC disabled so Serial uses UART0.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    ; LVGL 9: include/lv_conf.h, fonts in src/hmi/fonts include "lvgl.h"
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude
    -std=gnu++17
build_unflags = -std=gnu++11

lib_deps = 
    lovyan03/LovyanGFX@^1.1.9
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.1
    mathertel/OneButton@^2.0.2
    lvgl/lvgl@9.2.2

lib_ldf_mode = chain+

[env:esp32-4848s040-ota]
extends = env:esp32-4848s040
upload_protocol = espota
upload_port = 192.168.1.XXX

[platformio]
default_envs = esp32-4848s040
boards_dir = reference/LovyanGFX-GUITION-ESP32-4848S040/board
